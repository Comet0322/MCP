repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: uv-lock-check
        name: uv lock --check
        description: Fails if uv.lock is out of sync with pyproject.toml
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false

# Deliberately NOT here: the fast pytest suite, docker build, container
# smoke tests, or anything that calls an LLM API. Those belong in CI
# (.github/workflows/ci.yml) -- pre-commit should stay fast enough that it
# doesn't add friction to every single commit, and can't assume a docker
# daemon or network access are available locally.
