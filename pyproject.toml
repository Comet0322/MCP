[project]
name = "my-mcp-template"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.121.0",
    "fastmcp>=3.4.6",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-exporter-prometheus>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic-settings>=2.15.0",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "inline-snapshot>=0.35.3",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
]
eval = [
    "deepeval>=4.1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "slow: calls a real LLM API and/or docker compose; excluded from the fast PR job",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]  # S = flake8-bandit (security)

[tool.ruff.lint.per-file-ignores]
# Bandit-class findings in test code are essentially never real security
# issues here: assert is the normal pytest idiom, fixture strings like
# "sk-lf-test" are fake credentials, and try/except/pass is sometimes used
# deliberately to check a side effect after an expected failure.
"tests/**" = ["S"]
